# Prometheus configuration for Backup Health Monitor
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "backup-monitor"
    static_configs:
      - targets:
          - backup-monitor:9108
    scrape_interval: 60s
    scrape_timeout: 30s
