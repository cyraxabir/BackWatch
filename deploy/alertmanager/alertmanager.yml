# Alertmanager Configuration for Backup Health Monitor
#
# This is a minimal configuration.
# Replace webhook_configs URL with your actual notification endpoint.
# Use environment variables for sensitive URLs.

global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "server"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: "critical"
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: "default"
      repeat_interval: 4h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://backup-monitor:9108/webhook"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://backup-monitor:9108/webhook"
        send_resolved: true

